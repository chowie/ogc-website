[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"
  # Leave PUBLIC_ALLOW_INDEXING unset until go-live (keeps demo out of search).

# The live site is the newest release tag, not main's latest commit.
# Deploy previews (pull requests) still build their own commit.
[context.production]
  command = "bash scripts/build-release.sh"

# Pull requests: run the tests too, so a failing test fails the Netlify check.
[context.deploy-preview]
  command = "npm run verify"

# Calendar files: say UTF-8, so names with accents or curly quotes come out
# right in Apple Calendar and Outlook.
[[headers]]
  for = "/events/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
