# Checks the church YouTube channel for new sermons and adds them through a
# pull request that it merges itself (main only accepts changes via PRs).
# `npm run verify` (tests + build) runs first; no PR checks gate the merge,
# because PRs opened with GITHUB_TOKEN don't start other workflows.
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". The PR targets the branch the workflow runs on
# (main when scheduled), so running it by hand on a branch is a safe test.
name: Import sermons

on:
  schedule:
    # Twice a day (UTC): ~8 a.m. and ~6 p.m. Eastern.
    - cron: '0 12,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-sermons
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # If an earlier import PR didn't merge, stop rather than open duplicates
      # every run; the failed run is the signal to look at it.
      - name: Preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::Run this on a branch, not a $GITHUB_REF_TYPE"; exit 1
          fi
          open=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("content/sermons-")) | "#\(.number)"] | join(" ")')
          if [ -n "$open" ]; then
            echo "::error::Unmerged sermon import PR(s): $open. Merge or close them first."; exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Import new sermons
        run: npm run sermons:import

      - name: Check for new files
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/content/sermons)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            git status --short src/content/sermons
          else
            echo "No new sermons."
          fi

      # Don't merge anything that would break the tests or the site build.
      - name: Verify
        if: steps.changes.outputs.found == 'true'
        run: |
          npm ci
          npm run verify

      - name: Open and merge a pull request
        if: steps.changes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: content/sermons-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add src/content/sermons
          git commit -m "content: import new sermons from YouTube"
          git push -u origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "content: import new sermons from YouTube" \
            --body "Automated import from the church YouTube channel ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). `npm run verify` passed before this PR was opened."
          gh pr merge "$BRANCH" --squash --delete-branch
