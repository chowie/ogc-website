# Checks every pull request follows Conventional Commits
# (https://www.conventionalcommits.org/en/v1.0.0/): the PR title and each
# commit on the branch. Netlify's deploy preview is the build/test check.
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Passed through env, never interpolated into the script (titles are user input).
      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-msg.mjs --message "$TITLE"

      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-msg.mjs --range "$BASE..$HEAD"
